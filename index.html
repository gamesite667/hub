        // Initialize favorites from localStorage
        let favorites = JSON.parse(localStorage.getItem('gameFavorites')) || [];

        function isFavorited(gameTitle) {
            return favorites.includes(gameTitle);
        }

        function toggleFavorite(gameTitle) {
            if (isFavorited(gameTitle)) {
                favorites = favorites.filter(f => f !== gameTitle);
            } else {
                favorites.push(gameTitle);
            }
            localStorage.setItem('gameFavorites', JSON.stringify(favorites));
            renderGames();
            renderFavorites();
        }

        function createGameCard(game) {
            const isFav = isFavorited(game.title);
            return `
                <div class="game-card">
                    <div class="game-image"><div class="placeholder-image">${game.emoji}</div></div>
                    <div class="game-info">
                        <h3 class="game-title">${game.title}</h3>
                        <p class="game-description">${game.description}</p>
                        <div class="game-meta">${game.tags.map(tag => `<span class="game-tag">${tag}</span>`).join('')}</div>
                        <div class="game-actions">
                            <a href="${game.url}" class="btn btn-primary">Same Tab</a>
                            <a href="${game.url}" target="_blank" class="btn btn-secondary">New Tab</a>
                            <label class="favorite-btn">
                                <input type="checkbox" class="favorite-checkbox" ${isFav ? 'checked' : ''} onchange="toggleFavorite('${game.title}')"/>
                                ⭐ ${isFav ? 'Remove' : 'Add'}
                            </label>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderGames() {
            const grid = document.getElementById('games-grid');
            grid.innerHTML = games.map(game => createGameCard(game)).join('');
        }

        function renderFavorites() {
            const grid = document.getElementById('favorites-grid');
            const favoriteGames = games.filter(game => isFavorited(game.title));
            grid.innerHTML = favoriteGames.map(game => createGameCard(game)).join('');
        }

        // Theme handling
        document.querySelectorAll('input[name="theme"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                localStorage.setItem('theme', e.target.value);
            });
        });

        // Load saved theme
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.querySelector(`input[name="theme"][value="${savedTheme}"]`).checked = true;

        // Initial render
        renderGames();
        renderFavorites();
    </script>
